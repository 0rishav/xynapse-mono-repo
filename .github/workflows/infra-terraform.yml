name: "Infrastructure Deployment"

on:
  push:
    branches:
      - stage
      - main
      - release
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches:
      - main
      - release
    paths:
      - 'infrastructure/terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    env:
      TF_WORKING_DIR: >-
        ${{ (github.ref_name == 'main' || github.ref_name == 'release' || github.base_ref == 'main' || github.base_ref == 'release') 
            && './infrastructure/terraform/environments/prod' 
            || './infrastructure/terraform/environments/dev' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: >-
            ${{ github.ref_name == 'main' && 'sa-prod@xynapse-system.iam.gserviceaccount.com' ||
                github.ref_name == 'release' && 'sa-release@xynapse-system.iam.gserviceaccount.com' ||
                'sa-stage@xynapse-system.iam.gserviceaccount.com' }}
          export_environment_variables: true

      - name: Debug Secrets & Auth
        env:
          MY_GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MY_GCS_BUCKET: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          echo "--- DEBUG INFO ---"
          echo "Branch: ${{ github.ref_name }}"
          echo "Working Dir: ${{ env.TF_WORKING_DIR }}"
          
          echo "Checking Secrets Lengths (0 means empty):"
          echo "Project ID length: ${#MY_GCP_PROJECT}"
          echo "Bucket Name length: ${#MY_GCS_BUCKET}"
          
          echo "Active Account:"
          gcloud config get-value account || echo "No account set"
          
          echo "Authenticated Accounts:"
          gcloud auth list
      # --- DEBUG LOGS END ---

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=terraform/state/${{ github.base_ref || github.ref_name }}"

      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="job_id=${{ github.run_id }}"

  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    environment: >-
      ${{ github.ref_name == 'main' && 'production' || 
          github.ref_name == 'release' && 'release' || 
          'staging' 
      }}

    env:
      TF_WORKING_DIR: >-
        ${{ (github.ref_name == 'main' || github.ref_name == 'release') 
            && './infrastructure/terraform/environments/prod' 
            || './infrastructure/terraform/environments/dev' }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: >-
            ${{ github.ref_name == 'main' && 'sa-prod@xynapse-system.iam.gserviceaccount.com' ||
                github.ref_name == 'release' && 'sa-release@xynapse-system.iam.gserviceaccount.com' ||
                'sa-stage@xynapse-system.iam.gserviceaccount.com' }}

      # --- DEBUG LOGS START ---
      - name: Debug Auth & Environment
        run: |
          echo "--- DEBUG INFO ---"
          echo "Branch: ${{ github.ref_name }}"
          echo "Working Dir: ${{ env.TF_WORKING_DIR }}"
          echo "Active Account:"
          gcloud config get-value account
          echo "Authenticated Accounts:"
          gcloud auth list
          echo "------------------"
      # --- DEBUG LOGS END ---

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=terraform/state/${{ github.ref_name }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="job_id=${{ github.run_id }}"