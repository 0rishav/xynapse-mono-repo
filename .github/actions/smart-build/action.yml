name: 'Smart Build Engine'
description: 'Security-First Build, Scan, and Push with Full Reporting'

inputs:
  service_name: { required: true }
  project_id: { required: true }
  slack_webhook_url: { required: true }
  image_tag: { required: true }

runs:
  using: "composite"
  steps:
    # CACHE RESTORE FROM GCR
    - name: Restore Cache from GCR
      shell: bash
      run: |
        CACHE_IMAGE="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-cache/${{ inputs.service_name }}:latest"
        CONTAINER_NAME="cache-data-${{ inputs.service_name }}-${{ github.run_id }}"
        echo "Attempting to pull cache..."
        docker rm -f $CONTAINER_NAME || true
        if docker pull $CACHE_IMAGE 2>/dev/null; then
          echo "Cache found, extracting..."
          docker create --name $CONTAINER_NAME $CACHE_IMAGE /bin/true
          docker cp $CONTAINER_NAME:/data ./cache_data || mkdir -p ./cache_data/trivy
          docker rm $CONTAINER_NAME
        else
          echo "No existing cache found."
          mkdir -p ./cache_data/trivy
        fi

    # SECRET DETECTION
    - name: Secret Detection
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_ARTIFACT_NAME: gitleaks-report-${{ inputs.service_name }}
      with:
        report-path: gitleaks-report-${{ inputs.service_name }}.json
      continue-on-error: true

    # DOCKERFILE AUDIT
    - name: Dockerfile Guard
      shell: bash
      run: |
        chmod +x .github/scripts/docker-audit.sh
        ./.github/scripts/docker-audit.sh apps/${{ inputs.service_name }}-service/Dockerfile

    # TRIVY SCAN
    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@v0.35.0
      continue-on-error: true
      with:
        scan-type: 'fs'
        cache-dir: ./cache_data/trivy
        scan-ref: './apps/${{ inputs.service_name }}-service'
        format: 'json'
        output: 'report-${{ inputs.service_name }}.json'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    # DOCKER BUILD + PUSH
    - name: Build and Push to Artifact Registry
      shell: bash
      run: |
        IMAGE="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}"
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        docker build \
          -t ${IMAGE}:${{ github.sha }} \
          -t ${IMAGE}:${{ inputs.image_tag }} \
          -f ./apps/${{ inputs.service_name }}-service/Dockerfile .
        docker push ${IMAGE}:${{ github.sha }}
        docker push ${IMAGE}:${{ inputs.image_tag }}
        if [ "${{ github.ref }}" == "refs/heads/main" ]; then
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
          docker push ${IMAGE}:latest
        fi

    # COSIGN SIGNING
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.5.0
      with:
        cosign-release: 'v2.4.0'

    - name: Sign Image
      shell: bash
      env:
        COSIGN_CACHE: ${{ runner.temp }}/.cosign_cache
        HOME: ${{ runner.temp }}
      run: |
        IMAGE_REF="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}:${{ inputs.image_tag }}"
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        cosign sign --yes ${IMAGE_REF}

    # CACHE SAVE - SIRF TRIVY DATA
    - name: Save Cache to GCR
      shell: bash
      if: always()
      run: |
        mkdir -p ./cache_data/trivy
        CACHE_IMAGE="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-cache/${{ inputs.service_name }}:latest"
        cat > Dockerfile.cache.${{ inputs.service_name }} << 'DOCKERFILE'
        FROM scratch
        COPY ./cache_data/trivy /data/trivy
        DOCKERFILE
        docker build -t $CACHE_IMAGE -f Dockerfile.cache.${{ inputs.service_name }} .
        docker push $CACHE_IMAGE
        rm -f Dockerfile.cache.${{ inputs.service_name }}

    # SUMMARY
    - name: Generate Build Summary
      shell: bash
      if: always()
      run: |
        echo "### Consolidated Security Report: ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status | Tool Used |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Secrets Scan** | Done | Gitleaks |" >> $GITHUB_STEP_SUMMARY
        echo "| **Infra Audit** | Passed | Docker-Audit |" >> $GITHUB_STEP_SUMMARY
        echo "| **Vulnerabilities** | Scanned | Trivy |" >> $GITHUB_STEP_SUMMARY
        echo "| **Registry Status** | Pushed & Signed | GCR |" >> $GITHUB_STEP_SUMMARY

    # ARCHIVE
    - name: Archive Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ inputs.service_name }}
        path: |
          report-${{ inputs.service_name }}.json
          gitleaks-report-${{ inputs.service_name }}.json
        retention-days: 7

    # SLACK NOTIFY
    - name: Notify Slack
      if: always()
      shell: bash
      run: |
        COL="${{ job.status == 'success' && '#36a64f' || '#ff0000' }}"
        curl -X POST -H 'Content-type: application/json' --data "{
          \"text\": \"*Pipeline Stage 2: Security & Build Report*\",
          \"attachments\": [
            {
              \"color\": \"$COL\",
              \"fields\": [
                { \"title\": \"Service\", \"value\": \"${{ inputs.service_name }}\", \"short\": true },
                { \"title\": \"GCR Status\", \"value\": \"Pushed & Signed\", \"short\": true }
              ],
              \"actions\": [
                {
                  \"type\": \"button\",
                  \"text\": \"View Details\",
                  \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }
              ]
            }
          ]
        }" ${{ inputs.slack_webhook_url }}