name: 'Smart Deploy'
description: 'Updates K8s manifests with Semantic Tags and triggers ArgoCD'

inputs:
  service_name:
    description: 'Name of the service'
    required: true
  new_version:
    description: 'Semantic Version to deploy'
    required: true
  github_token:
    description: 'GH Token for git push'
    required: true
  project_id:
    description: 'GCP Project ID'
    required: true

runs:
  using: "composite"
  steps:
    - name: Update Kubernetes Manifest Tag
      shell: bash
      run: |
        FILE_PATH="k8s-manifests/${{ inputs.service_name }}/${{ inputs.service_name }}.yml"

        # Sirf is service ki image line replace karo
        sed -i "s|image: us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}:.*|image: us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}:${{ inputs.new_version }}|g" $FILE_PATH

        echo "Updated $FILE_PATH with new image: ${{ inputs.new_version }}"

    - name: Commit and Push to Repository
      shell: bash
      run: |
        git config user.name "xynapse-bot"
        git config user.email "bot@xynapse.ai"

        git add k8s-manifests/

        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to deploy."
          exit 0
        fi

        git commit -m "chore(gitops): update ${{ inputs.service_name }} to ${{ inputs.new_version }} [skip ci]"

        # Branch dynamically set karo
        TARGET_BRANCH="${GITHUB_REF_NAME}"
        MAX_RETRIES=5
        RETRY_COUNT=0

        until [ $RETRY_COUNT -ge $MAX_RETRIES ]
        do
          echo "Attempt $((RETRY_COUNT+1)) to push to $TARGET_BRANCH..."

          git fetch origin $TARGET_BRANCH
          git rebase origin/$TARGET_BRANCH || { git rebase --abort; echo "Rebase failed, retrying..."; }

          if git push https://x-access-token:${{ inputs.github_token }}@github.com/${{ github.repository }}.git HEAD:$TARGET_BRANCH; then
            echo "Push successful!"
            exit 0
          else
            RETRY_COUNT=$((RETRY_COUNT+1))
            WAIT_TIME=$(( (RANDOM % 5) + 3 ))
            echo "Push failed. Retrying in $WAIT_TIME seconds..."
            sleep $WAIT_TIME
          fi
        done

        echo "Failed to push after $MAX_RETRIES attempts."
        exit 1