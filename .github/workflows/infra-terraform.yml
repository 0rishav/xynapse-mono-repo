name: "Infrastructure Deployment"

on:
  push:
    branches: [ stage, main, release ]
    paths: [ 'infrastructure/terraform/**' ]
  pull_request:
    branches: [ main, release ]
    paths: [ 'infrastructure/terraform/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: ${{ (github.ref_name == 'main' || github.ref_name == 'release' || github.base_ref == 'main' || github.base_ref == 'release') && './infrastructure/terraform/environments/prod' || './infrastructure/terraform/environments/dev' }}
  GCP_SA: ${{ github.ref_name == 'main' && 'sa-prod@xynapse-system.iam.gserviceaccount.com' || github.ref_name == 'release' && 'sa-release@xynapse-system.iam.gserviceaccount.com' || 'sa-stage@xynapse-system.iam.gserviceaccount.com' }}

jobs:
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA }}
          export_environment_variables: true

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=terraform/state/${{ github.base_ref || github.ref_name }}"

      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="job_id=${{ github.run_id }}" \
            -var="repo_owner=${{ github.repository_owner }}" \
            -var="repo_name=${{ github.event.repository.name }}" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}"

  terraform-apply:
    name: "Terraform Apply"
    needs: terraform-plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'release' && 'release' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SA }}
          export_environment_variables: true

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=terraform/state/${{ github.ref_name }}"

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="job_id=${{ github.run_id }}" \
            -var="repo_owner=${{ github.repository_owner }}" \
            -var="repo_name=${{ github.event.repository.name }}" \
            -var="github_token=${{ secrets.GITHUB_TOKEN }}"