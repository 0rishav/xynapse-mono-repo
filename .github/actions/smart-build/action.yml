name: 'Smart Build Engine'
description: 'Security-First Build, Scan, and Push with Full Reporting'

inputs:
  service_name: { required: true }
  project_id: { required: true }
  slack_webhook_url: { required: true }
  image_tag: { required: true }

runs:
  using: "composite"
  steps:
    # SECRET DETECTION
    - name: Secret Detection
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITLEAKS_ARTIFACT_NAME: gitleaks-report-${{ inputs.service_name }}
      with:
        report-path: gitleaks-report-${{ inputs.service_name }}.json
      continue-on-error: true

    # DOCKERFILE AUDIT
    - name: Dockerfile Guard
      shell: bash
      run: |
        chmod +x .github/scripts/docker-audit.sh
        ./.github/scripts/docker-audit.sh apps/${{ inputs.service_name }}-service/Dockerfile

    # TRIVY SCAN - Kaniko se pehle source scan
    - name: Trivy Filesystem Scan
      uses: aquasecurity/trivy-action@0.29.0
      with:
        scan-type: 'fs'
        scan-ref: './apps/${{ inputs.service_name }}-service'
        format: 'json'
        output: 'report-${{ inputs.service_name }}.json'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    # KANIKO BUILD + PUSH
    - name: Build and Push with Kaniko
      shell: bash
      run: |
        IMAGE="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}"

        cat <<EOF > /tmp/kaniko-job-${{ inputs.service_name }}.yaml
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: kaniko-${{ github.run_id }}-${{ inputs.service_name }}
          namespace: arc-runners
        spec:
          ttlSecondsAfterFinished: 300
          template:
            spec:
              serviceAccountName: kaniko-sa
              restartPolicy: Never
              containers:
                - name: kaniko
                  image: gcr.io/kaniko-project/executor:latest
                  args:
                    - "--context=git://github.com/${{ github.repository }}#refs/heads/${{ github.ref_name }}"
                    - "--git=branch=${{ github.ref_name }}"
                    - "--dockerfile=apps/${{ inputs.service_name }}-service/Dockerfile"
                    - "--destination=${IMAGE}:${{ github.sha }}"
                    - "--destination=${IMAGE}:${{ inputs.image_tag }}"
                    - "--destination=${IMAGE}:latest"
                    - "--cache=true"
                    - "--cache-repo=${IMAGE}-cache"
                  env:
                    - name: GOOGLE_APPLICATION_CREDENTIALS
                      value: /var/run/secrets/token
        EOF

        kubectl apply -f /tmp/kaniko-job-${{ inputs.service_name }}.yaml

        echo "Waiting for Kaniko job to complete..."
        kubectl wait --for=condition=complete \
          job/kaniko-${{ github.run_id }}-${{ inputs.service_name }} \
          -n arc-runners \
          --timeout=600s

        echo "Build successful!"

    # COSIGN SIGNING
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.5.0

    - name: Sign Image
      shell: bash
      run: |
        IMAGE_REF="us-central1-docker.pkg.dev/${{ inputs.project_id }}/xynapse-mono-repo/${{ inputs.service_name }}:${{ inputs.image_tag }}"
        cosign sign --yes ${IMAGE_REF}

    # SUMMARY
    - name: Generate Build Summary
      shell: bash
      if: always()
      run: |
        echo "### Consolidated Security Report: ${{ inputs.service_name }}" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status | Tool Used |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Secrets Scan** | Done | Gitleaks |" >> $GITHUB_STEP_SUMMARY
        echo "| **Infra Audit** | Passed | Docker-Audit |" >> $GITHUB_STEP_SUMMARY
        echo "| **Vulnerabilities** | Scanned | Trivy |" >> $GITHUB_STEP_SUMMARY
        echo "| **Registry Status** | Pushed & Signed | GCR |" >> $GITHUB_STEP_SUMMARY

    # CLEANUP KANIKO JOB
    - name: Cleanup Kaniko Job
      shell: bash
      if: always()
      run: |
        kubectl delete job kaniko-${{ github.run_id }}-${{ inputs.service_name }} \
          -n arc-runners --ignore-not-found=true

    # ARCHIVE
    - name: Archive Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ inputs.service_name }}
        path: |
          report-${{ inputs.service_name }}.json
          gitleaks-report-${{ inputs.service_name }}.json
        retention-days: 7

    # SLACK NOTIFY
    - name: Notify Slack
      if: always()
      shell: bash
      run: |
        COL="${{ job.status == 'success' && '#36a64f' || '#ff0000' }}"
        curl -X POST -H 'Content-type: application/json' --data "{
          \"text\": \"*Pipeline Stage 2: Security & Build Report*\",
          \"attachments\": [
            {
              \"color\": \"$COL\",
              \"fields\": [
                { \"title\": \"Service\", \"value\": \"${{ inputs.service_name }}\", \"short\": true },
                { \"title\": \"GCR Status\", \"value\": \"Pushed & Signed\", \"short\": true }
              ],
              \"actions\": [
                {
                  \"type\": \"button\",
                  \"text\": \"View Details\",
                  \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }
              ]
            }
          ]
        }" ${{ inputs.slack_webhook_url }}